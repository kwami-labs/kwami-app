# Version updates open against `dev`, not `main`. They still go through the same
# CI gate as everything else. Promote `dev` to `stg` to `main` the usual way.
#
# Dependabot reads this file from the default branch, so this setting only takes
# effect once it is on `main`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
